name: "Deploy Medical Project"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7.5"

jobs:

  # ── Job 1 : verifier si une VM existe deja ──────────────────────────────
  check:
    name: "Job 1 - Check VM existante"
    runs-on: ubuntu-latest
    outputs:
      vm_exists: ${{ steps.check_vm.outputs.vm_exists }}
      server_ip: ${{ steps.check_vm.outputs.server_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verifier etat EC2 et demarrer si stoppee
        id: check_vm
        run: |
          # ─── 1. Chercher UNE SEULE instance active (running ou stopped) ────────
          # On prend la plus recente pour eviter d'en avoir plusieurs
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=medical-app-server" \
                      "Name=instance-state-name,Values=running,stopped" \
            --query "sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId" \
            --output text 2>/dev/null || echo "None")

          INSTANCE_STATE=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=medical-app-server" \
                      "Name=instance-state-name,Values=running,stopped" \
            --query "sort_by(Reservations[].Instances[], &LaunchTime)[-1].State.Name" \
            --output text 2>/dev/null || echo "None")

          echo "Instance ID    : $INSTANCE_ID"
          echo "Instance State : $INSTANCE_STATE"

          # ─── 2. Verifier et terminer les instances dupliquees (sauf la plus recente) ──
          ALL_INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=medical-app-server" \
                      "Name=instance-state-name,Values=running,stopped" \
            --query "sort_by(Reservations[].Instances[], &LaunchTime)[:-1].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALL_INSTANCE_IDS" ] && [ "$ALL_INSTANCE_IDS" != "None" ]; then
            echo "WARN: Instances dupliquees detectees — arret des anciennes : $ALL_INSTANCE_IDS"
            for OLD_ID in $ALL_INSTANCE_IDS; do
              aws ec2 terminate-instances --instance-ids "$OLD_ID" 2>/dev/null || true
              echo "  Instance $OLD_ID terminee"
            done
          fi

          # ─── 3. Recuperer l'IP Elastic associee a cette instance ────────────
          SERVER_IP=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=medical-app-eip" \
            --query "Addresses[0].PublicIp" \
            --output text 2>/dev/null || echo "")

          if [ -z "$SERVER_IP" ] || [ "$SERVER_IP" = "None" ] || [ "$SERVER_IP" = "null" ]; then
            # Fallback : lire depuis le tfstate si disponible
            if [ -f terraform/terraform.tfstate ]; then
              SERVER_IP=$(jq -r '[.resources[] | select(.type=="aws_eip") | .instances[0].attributes.public_ip // ""] | first // ""' terraform/terraform.tfstate 2>/dev/null || echo "")
            fi
          fi

          echo "Elastic IP     : $SERVER_IP"

          # ─── 4. Instance stoppee : demarrer sans recreer ────────────────────
          if [ "$INSTANCE_STATE" = "stopped" ]; then
            echo "Instance stoppee detectee — demarrage sans recreation..."
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            echo "Attente etat running (max 5 min)..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

            # Reassocier l'EIP si elle n'est pas encore associee
            EIP_ASSOC=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=medical-app-eip" \
              --query "Addresses[0].AssociationId" \
              --output text 2>/dev/null || echo "")

            if [ -z "$EIP_ASSOC" ] || [ "$EIP_ASSOC" = "None" ] || [ "$EIP_ASSOC" = "null" ]; then
              EIP_ALLOC=$(aws ec2 describe-addresses \
                --filters "Name=tag:Name,Values=medical-app-eip" \
                --query "Addresses[0].AllocationId" \
                --output text 2>/dev/null || echo "")
              if [ -n "$EIP_ALLOC" ] && [ "$EIP_ALLOC" != "None" ]; then
                echo "Reassociation EIP $SERVER_IP -> instance $INSTANCE_ID..."
                aws ec2 associate-address \
                  --instance-id "$INSTANCE_ID" \
                  --allocation-id "$EIP_ALLOC" 2>/dev/null || true
              fi
            fi

            echo "Attente SSH sur $SERVER_IP (max 5 min)..."
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
            chmod 600 ~/.ssh/labsuser.pem
            for i in $(seq 1 30); do
              if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes \
                 -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "echo ok" 2>/dev/null; then
                echo "SSH pret apres $((i * 10))s"
                break
              fi
              echo "  Tentative SSH $i/30..."
              sleep 10
            done

            echo "vm_exists=true"       >> "$GITHUB_OUTPUT"
            echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ─── 5. Instance deja running : verifier SSH ─────────────────────────
          if [ "$INSTANCE_STATE" = "running" ] && [ -n "$SERVER_IP" ] && [ "$SERVER_IP" != "None" ] && [ "$SERVER_IP" != "null" ]; then
            echo "Instance running — verification SSH sur $SERVER_IP..."
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
            chmod 600 ~/.ssh/labsuser.pem
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes \
               -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "echo ok" 2>/dev/null; then
              echo "vm_exists=true"       >> "$GITHUB_OUTPUT"
              echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ─── 6. Aucune instance valide : laisser Terraform creer ─────────────
          echo "Aucune instance existante valide — creation via Terraform"
          echo "vm_exists=false" >> "$GITHUB_OUTPUT"
          echo "server_ip="      >> "$GITHUB_OUTPUT"

  # ── Job 2 : provisionner EC2 via Terraform ──────────────────────────────
  terraform:
    name: "Job 2 - Provision EC2"
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.vm_exists != 'true'
    outputs:
      server_ip: ${{ steps.tf_output.outputs.server_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Importer ressources AWS existantes
        working-directory: ./terraform
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=medical-app-sg" \
            --query "SecurityGroups[0].GroupId" \
            --output text 2>/dev/null || echo "None")
          if [ "$SG_ID" != "None" ] && [ "$SG_ID" != "null" ] && [ -n "$SG_ID" ]; then
            terraform import aws_security_group.medical_sg "$SG_ID" 2>/dev/null || true
          fi

          # Import de la SEULE instance existante (la plus recente)
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=medical-app-server" \
                      "Name=instance-state-name,Values=running,stopped" \
            --query "sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId" \
            --output text 2>/dev/null || echo "None")
          if [ "$INSTANCE_ID" != "None" ] && [ "$INSTANCE_ID" != "null" ] && [ -n "$INSTANCE_ID" ]; then
            terraform import aws_instance.medical_app "$INSTANCE_ID" 2>/dev/null || true
          fi

          EIP_ALLOC=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=medical-app-eip" \
            --query "Addresses[0].AllocationId" \
            --output text 2>/dev/null || echo "None")
          if [ "$EIP_ALLOC" != "None" ] && [ "$EIP_ALLOC" != "null" ] && [ -n "$EIP_ALLOC" ]; then
            terraform import aws_eip.medical_eip "$EIP_ALLOC" 2>/dev/null || true
          fi

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="db_app_password=${{ secrets.DB_APP_PASSWORD }}" \
            -var="mysql_root_password=${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Recuperer Elastic IP
        id: tf_output
        working-directory: ./terraform
        run: |
          SERVER_IP=$(terraform output -raw elastic_ip 2>/dev/null || echo "")
          if [ -z "$SERVER_IP" ] || [ "$SERVER_IP" = "null" ]; then
            echo "ERREUR : elastic_ip output vide depuis Terraform"
            exit 1
          fi
          echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
          echo "Nouvelle VM : $SERVER_IP"

      - name: Sauvegarder Terraform State
        if: always()
        working-directory: ./terraform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git stash -- terraform.tfstate terraform.tfstate.backup 2>/dev/null || true
          git pull --rebase origin main || true
          git stash pop 2>/dev/null || true
          git add terraform.tfstate terraform.tfstate.backup 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update terraform state [skip ci]"
          git push || echo "Push state echoue"

  # ── Job 3 : deployer l'application ──────────────────────────────────────
  setup:
    name: "Job 3 - Deploy Application"
    runs-on: ubuntu-latest
    needs: [check, terraform]
    if: >
      always() &&
      needs.check.result == 'success' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── FIX PRINCIPAL : resolution d'IP robuste ──────────────────────────
      # Priorite : 1) VM existante (check) → 2) nouvelle VM (terraform) → 3) EIP AWS direct → erreur
      - name: Determiner IP du serveur
        id: get_ip
        run: |
          VM_EXISTS="${{ needs.check.outputs.vm_exists }}"
          IP_FROM_CHECK="${{ needs.check.outputs.server_ip }}"
          IP_FROM_TF="${{ needs.terraform.outputs.server_ip }}"

          echo "vm_exists     = $VM_EXISTS"
          echo "ip from check = $IP_FROM_CHECK"
          echo "ip from tf    = $IP_FROM_TF"

          # Cas 1 : VM existante (running ou stopped redemarree)
          if [ "$VM_EXISTS" == "true" ] && [ -n "$IP_FROM_CHECK" ] && [ "$IP_FROM_CHECK" != "null" ]; then
            echo "Source IP : check (VM existante) → $IP_FROM_CHECK"
            echo "server_ip=$IP_FROM_CHECK" >> "$GITHUB_OUTPUT"

          # Cas 2 : Nouvelle VM cree par Terraform
          elif [ -n "$IP_FROM_TF" ] && [ "$IP_FROM_TF" != "null" ]; then
            echo "Source IP : terraform (nouvelle VM) → $IP_FROM_TF"
            echo "server_ip=$IP_FROM_TF" >> "$GITHUB_OUTPUT"

          # Cas 3 : Fallback AWS direct sur l'EIP (filet de securite)
          else
            echo "Fallback : interrogation AWS pour l'EIP..."
            IP_FROM_AWS=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=medical-app-eip" \
              --query "Addresses[0].PublicIp" \
              --output text 2>/dev/null || echo "")
            if [ -n "$IP_FROM_AWS" ] && [ "$IP_FROM_AWS" != "None" ] && [ "$IP_FROM_AWS" != "null" ]; then
              echo "Source IP : AWS EIP fallback → $IP_FROM_AWS"
              echo "server_ip=$IP_FROM_AWS" >> "$GITHUB_OUTPUT"
            else
              echo "ERREUR : aucune IP disponible (check=$IP_FROM_CHECK, tf=$IP_FROM_TF, aws=$IP_FROM_AWS)"
              exit 1
            fi
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
          chmod 600 ~/.ssh/labsuser.pem

      - name: Attendre SSH
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          echo "Attente SSH sur $SERVER_IP..."
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "echo ok" 2>/dev/null; then
              echo "SSH pret apres $((i * 10))s"
              break
            fi
            echo "  Tentative $i/40..."
            sleep 10
          done

      - name: Copier le script setup
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/labsuser.pem \
            scripts/setup.sh ubuntu@"$SERVER_IP":/tmp/setup.sh

      - name: Executer le setup
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
          VM_EXISTS: ${{ needs.check.outputs.vm_exists }}
          ELASTIC_IP: ${{ steps.get_ip.outputs.server_ip }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        timeout-minutes: 20
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -o ConnectTimeout=30 \
              -i ~/.ssh/labsuser.pem \
              ubuntu@"$SERVER_IP" \
              "chmod +x /tmp/setup.sh && sudo \
                VM_EXISTS='$VM_EXISTS' \
                ELASTIC_IP='$ELASTIC_IP' \
                DB_APP_PASSWORD='$DB_APP_PASSWORD' \
                MYSQL_ROOT_PASSWORD='$MYSQL_ROOT_PASSWORD' \
                bash /tmp/setup.sh"

  # ── Job 4 : demarrer les services ───────────────────────────────────────
  run:
    name: "Job 4 - Start Services"
    runs-on: ubuntu-latest
    needs: [check, terraform, setup]
    if: always() && needs.setup.result == 'success'
    steps:
      # ─── FIX PRINCIPAL : meme logique robuste que Job 3 ──────────────────
      - name: Determiner IP du serveur
        id: get_ip
        run: |
          VM_EXISTS="${{ needs.check.outputs.vm_exists }}"
          IP_FROM_CHECK="${{ needs.check.outputs.server_ip }}"
          IP_FROM_TF="${{ needs.terraform.outputs.server_ip }}"

          echo "vm_exists     = $VM_EXISTS"
          echo "ip from check = $IP_FROM_CHECK"
          echo "ip from tf    = $IP_FROM_TF"

          if [ "$VM_EXISTS" == "true" ] && [ -n "$IP_FROM_CHECK" ] && [ "$IP_FROM_CHECK" != "null" ]; then
            echo "Source IP : check (VM existante) → $IP_FROM_CHECK"
            echo "server_ip=$IP_FROM_CHECK" >> "$GITHUB_OUTPUT"

          elif [ -n "$IP_FROM_TF" ] && [ "$IP_FROM_TF" != "null" ]; then
            echo "Source IP : terraform (nouvelle VM) → $IP_FROM_TF"
            echo "server_ip=$IP_FROM_TF" >> "$GITHUB_OUTPUT"

          else
            echo "Fallback : interrogation AWS pour l'EIP..."
            IP_FROM_AWS=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=medical-app-eip" \
              --query "Addresses[0].PublicIp" \
              --output text 2>/dev/null || echo "")
            if [ -n "$IP_FROM_AWS" ] && [ "$IP_FROM_AWS" != "None" ] && [ "$IP_FROM_AWS" != "null" ]; then
              echo "Source IP : AWS EIP fallback → $IP_FROM_AWS"
              echo "server_ip=$IP_FROM_AWS" >> "$GITHUB_OUTPUT"
            else
              echo "ERREUR : aucune IP disponible (check=$IP_FROM_CHECK, tf=$IP_FROM_TF, aws=$IP_FROM_AWS)"
              exit 1
            fi
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
          chmod 600 ~/.ssh/labsuser.pem

      - name: Ecrire le script de demarrage
        env:
          REMOTE_SCRIPT: |
            #!/bin/bash
            set -e

            echo "=== Attente du bootstrap user_data (max 25 min) ==="
            for i in $(seq 1 50); do
              if grep -q "Bootstrap complete" /var/log/medical-bootstrap.log 2>/dev/null; then
                echo "Bootstrap complete detecte apres $((i*30))s"
                break
              fi
              if [ "$i" -eq 50 ]; then
                echo "WARN: timeout 25min - etat du bootstrap:"
                tail -10 /var/log/medical-bootstrap.log 2>/dev/null || true
              else
                echo "  Attente $i/50 (30s)..."
                sleep 30
              fi
            done

            echo "=== MySQL ==="
            sudo systemctl is-active mysql || sudo systemctl start mysql
            sleep 2

            echo "=== Liberation port 8000 ==="
            sudo fuser -k 8000/tcp 2>/dev/null || true
            sudo systemctl stop medical-backend 2>/dev/null || true
            sleep 2

            echo "=== Backend ==="
            if [ -f /opt/backend/venv/bin/python ]; then
              echo "Venv OK - lancement runserver"
            elif [ -f /opt/backend/requirements.txt ]; then
              echo "Venv absent - recreation..."
              sudo rm -rf /opt/backend/venv
              sudo python3 -m venv /opt/backend/venv
              sudo /opt/backend/venv/bin/pip install -r /opt/backend/requirements.txt -q
              sudo chown -R ubuntu:ubuntu /opt/backend/venv
            else
              echo "ERROR: /opt/backend non configure - bootstrap incomplet"
              tail -30 /var/log/medical-bootstrap.log 2>/dev/null || true
              exit 1
            fi

            echo "=== Lancement Django via systemd ==="
            printf '[Unit]\nDescription=Medical Backend Django\nAfter=network.target mysql.service\nWants=mysql.service\n\n[Service]\nType=simple\nUser=ubuntu\nWorkingDirectory=/opt/backend\nExecStart=/opt/backend/venv/bin/python manage.py runserver 0.0.0.0:8000\nRestart=always\nRestartSec=5\nStandardOutput=append:/tmp/backend.log\nStandardError=append:/tmp/backend.log\nEnvironment=PYTHONUNBUFFERED=1\n\n[Install]\nWantedBy=multi-user.target\n' | sudo tee /etc/systemd/system/medical-backend.service > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable medical-backend
            sudo systemctl restart medical-backend
            sleep 5
            STATUS=$(sudo systemctl is-active medical-backend 2>/dev/null || echo "unknown")
            echo "Backend service : $STATUS"

            echo "=== nginx ==="
            sudo systemctl is-active nginx || sudo systemctl start nginx
            sleep 5
            echo "=== Endpoints ==="
            curl -s -o /dev/null -w "Frontend :80   HTTP %{http_code}\n" http://localhost/ || true
            curl -s -o /dev/null -w "Backend  :8000 HTTP %{http_code}\n" http://localhost:8000/api/ || true
            echo "=== Logs backend ==="
            tail -10 /tmp/backend.log || true
        run: printf '%s' "$REMOTE_SCRIPT" > /tmp/start_services.sh

      - name: Copier et executer le script de demarrage
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        timeout-minutes: 10
        run: |
          scp -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/labsuser.pem /tmp/start_services.sh ubuntu@"$SERVER_IP":/tmp/start_services.sh
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" \
              "chmod +x /tmp/start_services.sh && sudo bash /tmp/start_services.sh"

      - name: Afficher les URLs
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          echo ""
          echo "=========================================="
          echo "  PROJET MEDICAL - DEPLOYE AVEC SUCCES"
          echo "=========================================="
          echo "  Frontend : http://$SERVER_IP"
          echo "  Backend  : http://$SERVER_IP:8000"
          echo "  API      : http://$SERVER_IP/api/"
          echo "  SSH      : ssh -i labsuser.pem ubuntu@$SERVER_IP"
          echo "=========================================="